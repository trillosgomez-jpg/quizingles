<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farm Adventure - Grade 2 English Practice</title>
  <style>
    :root {
      --primary: #4CAF50;
      --primary-dark: #388E3C;
      --secondary: #FF9800;
      --accent: #2196F3;
      --background: #E8F5E9;
      --card-bg: #FFFFFF;
      --text: #2E7D32;
      --text-dark: #1B5E20;
      --incorrect: #F44336;
      --correct: #4CAF50;
    }

    * {
      box-sizing: border-box;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Fredoka', cursive, sans-serif;
    }

    body {
      background-color: var(--background);
      margin: 0;
      padding: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background: var(--card-bg);
      border-radius: 24px;
      padding: 24px;
      max-width: 650px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      border: 4px solid var(--primary);
      position: relative;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      color: var(--text-dark);
      margin: 0 0 10px 0;
      font-size: 26px;
    }

    .quiz-selector {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 15px;
    }

    .quiz-tab {
      background: #E0E0E0;
      color: #666;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }

    .quiz-tab.active {
      background: var(--secondary);
      color: white;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }

    .progress-bar-container {
      background: #E0E0E0;
      height: 16px;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 15px;
    }

    .progress-bar {
      background: var(--primary);
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
    }

    .stats {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 16px;
      font-weight: bold;
      color: var(--text-dark);
      margin-bottom: 15px;
    }

    .card {
      background: #F9F9F9;
      border: 2px dashed var(--primary);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      text-align: center;
    }

    .question-title {
      font-size: 20px;
      color: #333;
      margin-bottom: 15px;
    }

    .audio-btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 16px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 15px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: transform 0.1s;
    }

    .audio-btn:active {
      transform: scale(0.95);
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 15px;
    }

    .option-btn {
      background: white;
      border: 3px solid #DDD;
      border-radius: 12px;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      color: #333;
      cursor: pointer;
      transition: all 0.2s;
    }

    .option-btn:hover {
      border-color: var(--accent);
      background: #E3F2FD;
    }

    .fill-input {
      width: 80%;
      padding: 12px;
      font-size: 18px;
      border: 3px solid var(--accent);
      border-radius: 12px;
      text-align: center;
      margin-top: 10px;
      outline: none;
    }

    .submit-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.15);
    }

    .feedback {
      margin-top: 15px;
      padding: 15px;
      border-radius: 12px;
      font-size: 15px;
      display: none;
      text-align: left;
    }

    .feedback.incorrect {
      background: #FFEBEE;
      border: 2px solid var(--incorrect);
      color: #C62828;
    }

    .feedback-title {
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 5px;
    }

    .next-btn {
      background: var(--secondary);
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 30px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
      display: none;
      box-shadow: 0 4px 6px rgba(0,0,0,0.15);
    }

    .results {
      text-align: center;
      display: none;
    }

    .results h2 {
      font-size: 28px;
      color: var(--text-dark);
    }

    .score-badge {
      font-size: 48px;
      margin: 15px 0;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>🌾 Farm English Quiz 🐮</h1>
    <div class="quiz-selector">
      <button class="quiz-tab active" onclick="switchQuiz(0)">Quiz 1</button>
      <button class="quiz-tab" onclick="switchQuiz(1)">Quiz 2</button>
      <button class="quiz-tab" onclick="switchQuiz(2)">Quiz 3</button>
    </div>
  </header>

  <div id="quiz-screen">
    <div class="progress-bar-container">
      <div class="progress-bar" id="progress"></div>
    </div>

    <div class="stats">
      <span id="question-count">Question 1/10</span>
      <span id="score-count">⭐ Score: 0</span>
    </div>

    <div class="card">
      <button class="audio-btn" onclick="speakQuestion()">🔊 Listen to Question</button>
      <div class="question-title" id="question-text">Loading question...</div>
      
      <div id="interactive-area"></div>
    </div>

    <div class="feedback incorrect" id="feedback">
      <div class="feedback-title">⚠️ Explicación Gramatical:</div>
      <div id="feedback-text"></div>
    </div>

    <div style="text-align: center;">
      <button class="next-btn" id="next-btn" onclick="nextQuestion()">Next Question ➡️</button>
    </div>
  </div>

  <div class="results" id="results-screen">
    <div class="score-badge">🌟</div>
    <h2>Quiz Completed!</h2>
    <p id="final-score" style="font-size: 20px; font-weight: bold;"></p>
    <p id="final-feedback"></p>
    <button class="submit-btn" style="background: var(--secondary);" onclick="nextQuiz()">Try Next Quiz 🚀</button>
  </div>
</div>

<script>
const quizData = [
  // QUIZ 1
  [
    {
      q: "A baby cow is called a...",
      type: "mc",
      options: ["calf", "chick", "duck", "rooster"],
      ans: "calf",
      explain: "En el vocabulario de la granja, el ternero o cría de la vaca se llama 'calf'."
    },
    {
      q: "What's the horse doing?",
      type: "mc",
      options: ["It's eating.", "They're sleeping.", "It's swimming.", "They're running."],
      ans: "It's eating.",
      explain: "Para hablar de un solo animal (singular como 'horse'), usamos 'It's + verbo con -ing' (It's eating)."
    },
    {
      q: "Is the girl eating?",
      type: "mc",
      options: ["No, she isn't.", "Yes, he is.", "No, they aren't.", "Yes, they are."],
      ans: "No, she isn't.",
      explain: "Para responder preguntas con 'Is the girl...?', usamos 'she' y si la respuesta es negativa es 'No, she isn't'."
    },
    {
      q: "What are the ducks doing?",
      type: "mc",
      options: ["They're swimming.", "It's eating.", "They're sleeping.", "It's running."],
      ans: "They're swimming.",
      explain: "Al ser plural ('ducks'), usamos el pronombre 'They're' seguido del verbo con -ing (They're swimming)."
    },
    {
      q: "Complete: A ________ grows plants and raises animals.",
      type: "fill",
      ans: "farmer",
      explain: "La persona que cultiva plantas y cuida animales en la granja se escribe 'farmer'."
    },
    {
      q: "Are they sleeping?",
      type: "mc",
      options: ["Yes, they are.", "No, he isn't.", "Yes, she is.", "No, it isn't."],
      ans: "Yes, they are.",
      explain: "Si la pregunta empieza con 'Are they...?' y es afirmativa, la respuesta correcta es 'Yes, they are.'"
    },
    {
      q: "Complete the question: _____ the boy swimming?",
      type: "fill",
      ans: "Is",
      explain: "Para hacer una pregunta sobre un niño (he / boy) en singular, usamos la palabra 'Is' al inicio."
    },
    {
      q: "Which animal sings early in the morning?",
      type: "mc",
      options: ["rooster", "sheep", "goat", "horse"],
      ans: "rooster",
      explain: "El gallo es quien canta temprano en la mañana y se escribe 'rooster'."
    },
    {
      q: "Is he washing his hands?",
      type: "mc",
      options: ["Yes, he is.", "No, she isn't.", "Yes, they are.", "No, they aren't."],
      ans: "Yes, he is.",
      explain: "Para un niño ('he'), si la respuesta es afirmativa contestamos 'Yes, he is.'"
    },
    {
      q: "Complete: The chicks are ________ (sleep).",
      type: "fill",
      ans: "sleeping",
      explain: "Para formar el Presente Continuo agregamos '-ing' al verbo 'sleep', dando como resultado 'sleeping'."
    }
  ],
  // QUIZ 2
  [
    {
      q: "A baby hen or rooster is a...",
      type: "mc",
      options: ["chick", "calf", "duck", "goat"],
      ans: "chick",
      explain: "El pollito (cría de la gallina o gallo) se escribe 'chick'."
    },
    {
      q: "What are the chicks doing?",
      type: "mc",
      options: ["They're sleeping.", "It's eating.", "They're swimming.", "It's running."],
      ans: "They're sleeping.",
      explain: "Al ser varios pollitos (plural), la respuesta gramatical correcta usa 'They're' (They're sleeping)."
    },
    {
      q: "Are they running?",
      type: "mc",
      options: ["Yes, they are.", "No, he isn't.", "No, she isn't.", "Yes, it is."],
      ans: "Yes, they are.",
      explain: "Las preguntas que inician con 'Are they...?' se responden afirmativamente con 'Yes, they are.'"
    },
    {
      q: "Complete: A horse can run very ________.",
      type: "fill",
      ans: "fast",
      explain: "La oración del libro indica que el caballo puede correr muy rápido: 'can run very fast'."
    },
    {
      q: "What's the hen doing?",
      type: "mc",
      options: ["It's walking.", "They're eating.", "It's swimming.", "They're sleeping."],
      ans: "It's walking.",
      explain: "Para la gallina en singular ('the hen'), respondemos con 'It's + verbo con -ing' (It's walking)."
    },
    {
      q: "Complete: ________ the girl playing?",
      type: "fill",
      ans: "Is",
      explain: "Al preguntar sobre 'the girl' (singular), la pregunta en Presente Continuo inicia obligatoriamente con 'Is'."
    },
    {
      q: "Which animal goes 'quack, quack'?",
      type: "mc",
      options: ["duck", "cow", "sheep", "rooster"],
      ans: "duck",
      explain: "El animal que hace el sonido 'quack, quack' es el pato: 'duck'."
    },
    {
      q: "Is the boy swimming?",
      type: "mc",
      options: ["Yes, he is.", "No, she isn't.", "Yes, they are.", "No, it isn't."],
      ans: "Yes, he is.",
      explain: "Al preguntar por 'the boy' (él), la respuesta corta afirmativa correcta es 'Yes, he is.'"
    },
    {
      q: "Complete: What are the ducks ________?",
      type: "fill",
      ans: "doing",
      explain: "La pregunta gramatical para saber qué están haciendo los animales es 'What are they doing?'."
    },
    {
      q: "Is she playing?",
      type: "mc",
      options: ["No, she isn't.", "Yes, they are.", "No, he isn't.", "Yes, it is."],
      ans: "No, she isn't.",
      explain: "La respuesta corta negativa para 'Is she...?' es 'No, she isn't'."
    }
  ],
  // QUIZ 3
  [
    {
      q: "What's the cow doing?",
      type: "mc",
      options: ["It's eating.", "They're running.", "It's swimming.", "They're playing."],
      ans: "It's eating.",
      explain: "Al preguntar por una sola vaca ('the cow'), la respuesta gramatical correcta es 'It's eating.'"
    },
    {
      q: "Complete: ________ they running?",
      type: "fill",
      ans: "Are",
      explain: "Las preguntas en Presente Continuo para el plural 'they' siempre comienzan con 'Are'."
    },
    {
      q: "Which animal gives us wool and says 'baa'?",
      type: "mc",
      options: ["sheep", "calf", "duck", "farmer"],
      ans: "sheep",
      explain: "La oveja se escribe 'sheep'."
    },
    {
      q: "Is he eating?",
      type: "mc",
      options: ["No, he isn't.", "Yes, she is.", "No, they aren't.", "Yes, it is."],
      ans: "No, he isn't.",
      explain: "Para decir que NO a una pregunta sobre un niño (he), la estructura es 'No, he isn't'."
    },
    {
      q: "Complete: The boy is ________ (swim).",
      type: "fill",
      ans: "swimming",
      explain: "Recuerda que al verbo 'swim' se le duplica la 'm' al pasar a Presente Continuo: 'swimming'."
    },
    {
      q: "What are the horses doing?",
      type: "mc",
      options: ["They're running.", "It's eating.", "They're swimming.", "It's sleeping."],
      ans: "They're running.",
      explain: "Para 'horses' en plural, utilizamos 'They're' seguido de la acción en -ing (They're running)."
    },
    {
      q: "Is the hen sleeping?",
      type: "mc",
      options: ["No, it isn't.", "Yes, they are.", "No, he isn't.", "Yes, she is."],
      ans: "No, it isn't.",
      explain: "Para referirnos a un animal como 'the hen' en respuestas cortas negativas, usamos 'No, it isn't'."
    },
    {
      q: "Complete: Is the boy washing his ________?",
      type: "fill",
      ans: "hands",
      explain: "En el ejercicio del libro la acción completa es 'wash his hands' (lavarse las manos)."
    },
    {
      q: "What's the farmer doing?",
      type: "mc",
      options: ["He's working.", "They're sleeping.", "It's swimming.", "They're playing."],
      ans: "He's working.",
      explain: "Para referirnos al granjero (he), respondemos 'He's working' (Él está trabajando)."
    },
    {
      q: "Complete: The girl is ________ (eat).",
      type: "fill",
      ans: "eating",
      explain: "Agregamos '-ing' al verbo 'eat' para obtener la forma continua correcta: 'eating'."
    }
  ]
];

let currentQuizIndex = 0;
let currentQuestionIndex = 0;
let score = 0;
let currentQuestion = null;

function initQuiz() {
  currentQuestionIndex = 0;
  score = 0;
  document.getElementById("results-screen").style.display = "none";
  document.getElementById("quiz-screen").style.display = "block";
  updateStats();
  loadQuestion();
}

function switchQuiz(index) {
  currentQuizIndex = index;
  const tabs = document.querySelectorAll('.quiz-tab');
  tabs.forEach((tab, i) => {
    tab.classList.toggle('active', i === index);
  });
  initQuiz();
}

function updateStats() {
  document.getElementById("question-count").innerText = `Question ${currentQuestionIndex + 1}/10`;
  document.getElementById("score-count").innerText = `⭐ Score: ${score}`;
  const progressPercent = ((currentQuestionIndex) / 10) * 100;
  document.getElementById("progress").style.width = `${progressPercent}%`;
}

function loadQuestion() {
  document.getElementById("feedback").style.display = "none";
  document.getElementById("next-btn").style.display = "none";
  
  currentQuestion = quizData[currentQuizIndex][currentQuestionIndex];
  document.getElementById("question-text").innerText = currentQuestion.q;
  
  const container = document.getElementById("interactive-area");
  container.innerHTML = "";

  if (currentQuestion.type === "mc") {
    const grid = document.createElement("div");
    grid.className = "options-grid";
    currentQuestion.options.forEach(opt => {
      const btn = document.createElement("button");
      btn.className = "option-btn";
      btn.innerText = opt;
      btn.onclick = () => checkAnswer(opt, btn);
      grid.appendChild(btn);
    });
    container.appendChild(grid);
  } else if (currentQuestion.type === "fill") {
    const input = document.createElement("input");
    input.type = "text";
    input.className = "fill-input";
    input.placeholder = "Type your answer here...";
    input.id = "user-input";
    
    const submitBtn = document.createElement("button");
    submitBtn.className = "submit-btn";
    submitBtn.innerText = "Check Answer";
    submitBtn.onclick = () => {
      const val = input.value.trim().toLowerCase();
      checkAnswer(val, submitBtn);
    };

    container.appendChild(input);
    container.appendChild(document.createElement("br"));
    container.appendChild(submitBtn);
  }

  setTimeout(speakQuestion, 400);
}

function speakQuestion() {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(currentQuestion.q);
    utterance.lang = 'en-US';
    utterance.rate = 0.85;
    window.speechSynthesis.speak(utterance);
  }
}

function checkAnswer(userAns, element) {
  const isCorrect = userAns.toLowerCase() === currentQuestion.ans.toLowerCase();
  
  const buttons = document.querySelectorAll(".option-btn, .submit-btn");
  buttons.forEach(b => b.disabled = true);
  const input = document.getElementById("user-input");
  if (input) input.disabled = true;

  if (isCorrect) {
    score += 10;
    if (element && element.tagName === "BUTTON") {
      element.style.background = "#C8E6C9";
      element.style.borderColor = "#4CAF50";
    }
  } else {
    document.getElementById("feedback-text").innerHTML = 
      `<strong>Respuesta correcta:</strong> ${currentQuestion.ans}<br><br>${currentQuestion.explain}`;
    document.getElementById("feedback").style.display = "block";
    if (element && element.tagName === "BUTTON") {
      element.style.background = "#FFCDD2";
      element.style.borderColor = "#F44336";
    }
  }

  document.getElementById("score-count").innerText = `⭐ Score: ${score}`;
  document.getElementById("next-btn").style.display = "inline-block";
}

function nextQuestion() {
  currentQuestionIndex++;
  if (currentQuestionIndex < 10) {
    updateStats();
    loadQuestion();
  } else {
    showResults();
  }
}

function showResults() {
  document.getElementById("progress").style.width = "100%";
  document.getElementById("quiz-screen").style.display = "none";
  document.getElementById("results-screen").style.display = "block";
  
  document.getElementById("final-score").innerText = `Final Score: ${score} / 100`;
  const feedbackEl = document.getElementById("final-feedback");
  
  if (score >= 80) {
    feedbackEl.innerText = "🌟 Great job! You know your farm vocabulary and continuous grammar very well!";
  } else if (score >= 50) {
    feedbackEl.innerText = "👍 Good effort! Review the questions you missed and try again!";
  } else {
    feedbackEl.innerText = "💪 Keep practicing! You can try this quiz again to get a higher score!";
  }
}

function nextQuiz() {
  currentQuizIndex = (currentQuizIndex + 1) % 3;
  switchQuiz(currentQuizIndex);
}

// Init
initQuiz();
</script>
</body>
</html>
